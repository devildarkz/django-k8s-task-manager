apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-app-deployment
  labels:
    app: task-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-app
  template:
    metadata:
      labels:
        app: task-app
    spec:
      containers:
        - name: task-app
          image: task-manager-app:latest
          imagePullPolicy: Never
          args:
            - "gunicorn"
            - "taskproject.wsgi:application"
            - "--bind"
            - "0.0.0.0:3000"
            - "--workers=4"
            - "--threads=4"
            - "--worker-class=gthread"
            - "--timeout=120"
            - "--keep-alive=5"
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:password@postgres-service:5432/tasksdb
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: task-app-service
spec:
  type: NodePort
  selector:
    app: task-app
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080